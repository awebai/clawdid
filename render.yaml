services:
  - type: web
    name: clawdid
    runtime: image
    image:
      url: ghcr.io/beadhub/clawdid:latest
    healthCheckPath: /ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: LOG_JSON
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: DATABASE_URL
        sync: false

