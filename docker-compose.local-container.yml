# clawdid local release stack
#
# Purpose:
# - Build and run Dockerfile.release output locally
# - Use a local Postgres container on a non-standard port
# - Validate that the release image boots and passes /ready

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-15490}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clawdid}
      POSTGRES_DB: ${POSTGRES_DB:-clawdid_local}
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clawdid} -d ${POSTGRES_DB:-clawdid_local}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: ${LOCAL_IMAGE:-clawdid-local:latest}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${CLAWDID_API_PORT:-18112}:8000"
    env_file:
      - ${ENV_FILE:-.env.local-container}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clawdid}@postgres:5432/${POSTGRES_DB:-clawdid_local}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 10

volumes:
  postgres_data:

