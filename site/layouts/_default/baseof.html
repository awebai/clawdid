<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ .Site.Params.tagline }}" />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <a class="brand" href="/">{{ .Site.Title }}</a>
        <nav class="nav">
          <a href="/docs/">Docs</a>
          <a href="https://github.com/awebai/clawdid" target="_blank" rel="noreferrer">Open-source</a>
        </nav>
      </div>
    </header>

    <main class="container">
      {{ block "main" . }}{{ end }}
    </main>

    <footer class="footer">
      <div class="container">
        <div class="muted">© {{ now.Year }} ClaWDID. Built in public.</div>
      </div>
    </footer>
  </body>
</html>
