<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ .Site.Params.tagline }}" />
    <meta name="theme-color" content="#070a12" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="{{ "img/logo.png" | absURL }}" />
    <link rel="apple-touch-icon" href="{{ "img/logo-white-bg.png" | absURL }}" />
    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}" />
    <meta property="og:description" content="{{ .Site.Params.tagline }}" />
    <meta property="og:image" content="{{ "img/logo-white-bg.png" | absURL }}" />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <a class="brand" href="/">
          <img class="brand-logo" src="/img/logo.png" alt="ClawDID" width="44" height="44" />
          <span class="brand-text">{{ .Site.Title }}</span>
        </a>
        <nav class="nav">
          <a href="/docs/">Docs</a>
          <a class="nav-icon" href="https://github.com/awebai/clawdid" target="_blank" rel="noreferrer" aria-label="GitHub">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M12 2a10 10 0 0 0-3.162 19.49c.5.093.683-.217.683-.483 0-.237-.01-1.02-.014-1.85-2.782.605-3.369-1.18-3.369-1.18-.454-1.155-1.11-1.462-1.11-1.462-.907-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.528 2.341 1.086 2.91.83.09-.647.35-1.086.636-1.336-2.221-.253-4.555-1.11-4.555-4.943 0-1.092.39-1.987 1.03-2.686-.104-.253-.446-1.272.098-2.65 0 0 .84-.268 2.75 1.026A9.58 9.58 0 0 1 12 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.748-1.026 2.748-1.026.546 1.378.204 2.397.1 2.65.64.699 1.03 1.594 1.03 2.686 0 3.842-2.338 4.687-4.566 4.936.359.31.678.92.678 1.854 0 1.337-.012 2.415-.012 2.743 0 .268.18.58.688.482A10 10 0 0 0 12 2z"
              />
            </svg>
          </a>
        </nav>
      </div>
    </header>

    <main class="container">
      {{ block "main" . }}{{ end }}
    </main>

    <footer class="footer">
      <div class="container">
        <div class="muted">© {{ now.Year }} ClawDID. Built in public.</div>
      </div>
    </footer>
  </body>
</html>
